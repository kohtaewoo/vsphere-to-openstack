apiVersion: networking.k8s.io/v1 # networking.k8s.io/v1
kind: Ingress # Ingress

metadata:
  name: example-ingress

spec:
  rules:
    - host: example.com

      http:
        paths:
          - path: /api
            pathType: Prefix

            backend:
              service:
                name: api-service

                port:
                  number: 8080
          - path: /static
            pathType: Prefix

            backend:
              service:
                name: static-service

                port:
                  number: 80
          - path: /
            pathType: Prefix

            backend:
              service:
                name: example-service

                port:
                  number: 8080