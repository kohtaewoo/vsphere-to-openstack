apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-deployment
  namespace: api-system

spec:
  replicas: 3

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api-container 
          image: nginx:latest
          ports:
            - containerPort: 8080